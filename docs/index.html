<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gcoolers — Apple Silicon thermal governor</title>
  <meta name="description" content="Gcoolers keeps your Mac cool. Smart fans, menu bar, widgets. gcoolers.com" />
  <style>
    :root { --bg:#071018; --fg:#e8f4ff; --muted:#8aa0b8; --accent:#3dd6f5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--fg); background: radial-gradient(1200px 600px at 20% -10%, #0c3a4d, var(--bg));
      display: grid; place-items: center; padding: 32px;
    }
    main { max-width: 640px; }
    h1 { font-size: clamp(2.4rem, 6vw, 3.4rem); letter-spacing: -0.03em; margin: 0 0 8px; }
    .sub { color: var(--muted); margin-bottom: 28px; }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #0d1824; border: 1px solid #1c2e40; border-radius: 10px;
    }
    pre { padding: 16px 18px; overflow: auto; color: #d7f7ff; }
    a { color: var(--accent); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .btn {
      display: inline-block; padding: 10px 16px; border-radius: 999px; text-decoration: none;
      background: var(--accent); color: #04202a; font-weight: 600;
    }
    .btn.ghost { background: transparent; color: var(--fg); border: 1px solid #2a4158; }
  </style>
</head>
<body>
  <main>
    <h1>❄ Gcoolers</h1>
    <p class="sub">Apple Silicon thermal governor — smart fans, menu bar, Notification Center widget.<br/>Created by Gabe Mills.</p>
    <pre>brew tap Gabe-Mills/gcoolers
brew install gcoolers
gcoolers install</pre>
    <div class="row">
      <a class="btn" href="https://github.com/Gabe-Mills/gcoolers">GitHub</a>
      <a class="btn ghost" href="https://github.com/Gabe-Mills/homebrew-gcoolers">Homebrew tap</a>
    </div>
  </main>
</body>
</html>
