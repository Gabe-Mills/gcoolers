name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # The Astro site in website/ is what gcoolers.com serves now. docs/ is no
    # longer deployed, so a change there must not trigger a publish.
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json requires >=22.12.0.
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      # website/public/CNAME and website/public/.nojekyll are copied verbatim
      # into dist/ by Astro, so the custom domain and the underscore-prefixed
      # _astro/ asset directory both survive every build. Do not delete them.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - id: deployment
        uses: actions/deploy-pages@v4
